appId: dev.edygg.minerva
productName: Minerva
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.env'
  - '!**/.env.*'
  # `@anthropic-ai/claude-agent-sdk` (dependency, T28) trae un binario nativo
  # por plataforma (~250MB c/u: linux-x64, darwin-arm64, win32-x64, ...) como
  # optionalDependency SOLO para poder correr el CLI bundleado si nadie pasa
  # `pathToClaudeCodeExecutable`. Minerva SIEMPRE pasa esa opción apuntando al
  # `claude` del sistema (`src/main/ai/providers/claude-code-service.ts` +
  # `resolve-cli.ts`, T31) — bundlear esos binarios inflaría el instalador
  # +250MB por SO sin que se usen nunca. El glob matchea "claude-agent-sdk-*"
  # (los paquetes de plataforma) SIN matchear "claude-agent-sdk" a secas (el
  # paquete JS principal, ~3.8MB, que sí hace falta: expone `query()`).
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# Feed del auto-updater (F17/T89): esta sección es lo que hace que
# electron-builder escriba `app-update.yml` DENTRO del paquete (en
# resources/), con provider/owner/repo embebidos. Sin esta sección
# `app-update.yml` no existe y `electron-updater` lanza un error en
# runtime apenas la app arranca (no hay feed que consultar). El repo
# es PÚBLICO, así que el provider `github` no necesita credenciales
# para que los clientes LEAN el feed (sí las necesita el pipeline de
# release para publicar, ver .github/workflows/release.yml).
publish:
  provider: github
  owner: amiedygg
  repo: proj_minerva
asar: true
npmRebuild: false
linux:
  target:
    - AppImage
  category: Development
  executableName: minerva
  maintainer: Edilson
mac:
  category: public.app-category.developer-tools
  # macOS queda notify-only por ahora (decisión de producto F17: sin
  # Developer ID todavía, el updater real solo compara versión y
  # enlaza a la release). El target `zip` se genera YA de todos modos:
  # Squirrel.Mac (el mecanismo de electron-updater en macOS) necesita
  # el zip para que `latest-mac.yml` sirva de algo — así el día que
  # haya firma es solo firmar y no hay que volver a tocar el packaging.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
