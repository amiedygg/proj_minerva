appId: dev.edygg.minerva
productName: Minerva
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.env'
  - '!**/.env.*'
asar: true
npmRebuild: false
linux:
  target:
    - AppImage
  category: Development
  executableName: minerva
  maintainer: Edilson
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
